services:
  db:
    image: mysql:8.4
    container_name: sarmelle-db
    restart: unless-stopped
    # Host networking is required in this sandbox: the Docker bridge is
    # unavailable. MySQL therefore binds directly to 127.0.0.1:3307.
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: root_local_dev
      MYSQL_DATABASE: sarmelle_db
      MYSQL_USER: sarmelle
      MYSQL_PASSWORD: sarmelle_local_dev
    volumes:
      - sarmelle_mysql:/var/lib/mysql
    command:
      - --port=3307
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3307 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  sarmelle_mysql:
